<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin - Freshzito Portfolio</title>
    <link rel="stylesheet" href="/css/freshzito.css">
    <link rel="stylesheet" href="/css/admin.css">
</head>
<body class="admin-body">
    <div class="admin-layout">
        
        <!-- SIDEBAR -->
        <aside class="sidebar">
            <div class="sidebar-logo">FRESHZITO</div>
            <nav class="sidebar-nav">
                <a href="admin.html" class="sidebar-link active">
                    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <rect x="3" y="3" width="7" height="7"/><rect x="14" y="3" width="7" height="7"/>
                        <rect x="14" y="14" width="7" height="7"/><rect x="3" y="14" width="7" height="7"/>
                    </svg>
                    Projetos
                </a>
                <a href="admin-config.html" class="sidebar-link">
                    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <circle cx="12" cy="12" r="3"/>
                        <path d="M12 1v6m0 6v6m5.2-13.2l-4.2 4.2m0 6l4.2 4.2M23 12h-6m-6 0H1m18.2 5.2l-4.2-4.2m0-6l4.2-4.2"/>
                    </svg>
                    Configurações
                </a>
            </nav>
            <button class="sidebar-logout" onclick="logout()">
                <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/>
                    <polyline points="16 17 21 12 16 7"/>
                    <line x1="21" y1="12" x2="9" y2="12"/>
                </svg>
                Sair
            </button>
        </aside>

        <!-- MAIN -->
        <main class="admin-main">
            <header class="admin-header">
                <h1>Gerenciar Projetos</h1>
                <button class="btn-primary" onclick="openModal()">
                    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <line x1="12" y1="5" x2="12" y2="19"/>
                        <line x1="5" y1="12" x2="19" y2="12"/>
                    </svg>
                    Novo Projeto
                </button>
            </header>

            <div class="admin-content">
                <div class="projects-grid" id="projects-grid">
                    <!-- Projetos renderizados via JS -->
                </div>

                <div class="empty-state" id="empty-state" style="display:none">
                    <svg width="64" height="64" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
                        <rect x="3" y="3" width="18" height="18" rx="2" ry="2"/>
                        <circle cx="8.5" cy="8.5" r="1.5"/>
                        <polyline points="21 15 16 10 5 21"/>
                    </svg>
                    <p>Nenhum projeto cadastrado ainda</p>
                    <button class="btn-primary" onclick="openModal()">Adicionar Primeiro Projeto</button>
                </div>
            </div>
        </main>
    </div>

    <!-- MODAL PROJETO -->
    <div class="modal-overlay" id="modal-overlay" onclick="closeModal()">
        <div class="modal" onclick="event.stopPropagation()" style="max-width: 600px;">
            <button class="modal-close" onclick="closeModal()">✕</button>
            <h2 id="modal-title">Novo Projeto</h2>
            
            <form id="project-form" class="admin-form">
                <div class="form-group">
                    <label>Título do Projeto</label>
                    <input type="text" id="project-title" required placeholder="Ex: Freshzito Branding">
                </div>

                <div class="form-group">
                    <label>Categoria</label>
                    <input type="text" id="project-category" required placeholder="Ex: Branding & Identity">
                </div>

                <div class="form-group">
                    <label>Descrição (opcional)</label>
                    <textarea id="project-description" rows="3" placeholder="Descrição do projeto..."></textarea>
                </div>

                <div class="form-group">
                    <label>Imagem do Projeto</label>
                    <div class="upload-area" id="upload-area">
                        <input type="file" id="project-image-file" accept="image/*" style="display: none;">
                        <div class="upload-placeholder" id="upload-placeholder">
                            <svg width="48" height="48" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
                                <rect x="3" y="3" width="18" height="18" rx="2" ry="2"/>
                                <circle cx="8.5" cy="8.5" r="1.5"/>
                                <polyline points="21 15 16 10 5 21"/>
                            </svg>
                            <p>Clique para fazer upload ou arraste a imagem aqui</p>
                            <small>JPG, PNG, GIF ou WEBP (máx. 5MB)</small>
                        </div>
                        <div class="upload-preview" id="upload-preview" style="display: none;">
                            <img id="preview-image" src="" alt="Preview">
                            <button type="button" class="btn-remove-image" onclick="removeImage()">
                                <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                                    <line x1="18" y1="6" x2="6" y2="18"/>
                                    <line x1="6" y1="6" x2="18" y2="18"/>
                                </svg>
                            </button>
                        </div>
                        <div class="upload-progress" id="upload-progress" style="display: none;">
                            <div class="progress-bar">
                                <div class="progress-fill" id="progress-fill"></div>
                            </div>
                            <p id="progress-text">Enviando...</p>
                        </div>
                    </div>
                    <input type="hidden" id="project-image" required>
                    <small style="color: var(--light-gray); font-size: 0.85rem; margin-top: 0.5rem; display: block;">
                        Ou cole uma URL de imagem externa
                    </small>
                    <input type="url" id="project-image-url" placeholder="https://exemplo.com/imagem.jpg" style="margin-top: 0.5rem;">
                </div>

                <div class="form-group">
                    <label>Link do Projeto (opcional)</label>
                    <input type="url" id="project-link" placeholder="https://behance.net/...">
                </div>

                <div class="form-actions">
                    <button type="button" class="btn-secondary" onclick="closeModal()">Cancelar</button>
                    <button type="submit" class="btn-primary">Salvar Projeto</button>
                </div>
            </form>
        </div>
    </div>

    <script src="/js/portfolio-admin.js"></script>
</body>
</html>
