<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Configurações - Freshzito Admin</title>
    <link rel="stylesheet" href="/css/freshzito.css">
    <link rel="stylesheet" href="/css/admin.css">
</head>
<body class="admin-body">
    <div class="admin-layout">
        
        <!-- SIDEBAR -->
        <aside class="sidebar">
            <div class="sidebar-logo">FRESHZITO</div>
            <nav class="sidebar-nav">
                <a href="admin.html" class="sidebar-link">
                    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <rect x="3" y="3" width="7" height="7"/><rect x="14" y="3" width="7" height="7"/>
                        <rect x="14" y="14" width="7" height="7"/><rect x="3" y="14" width="7" height="7"/>
                    </svg>
                    Projetos
                </a>
                <a href="admin-config.html" class="sidebar-link active">
                    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <circle cx="12" cy="12" r="3"/>
                        <path d="M12 1v6m0 6v6m5.2-13.2l-4.2 4.2m0 6l4.2 4.2M23 12h-6m-6 0H1m18.2 5.2l-4.2-4.2m0-6l4.2-4.2"/>
                    </svg>
                    Configurações
                </a>
            </nav>
            <button class="sidebar-logout" onclick="logout()">
                <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/>
                    <polyline points="16 17 21 12 16 7"/>
                    <line x1="21" y1="12" x2="9" y2="12"/>
                </svg>
                Sair
            </button>
        </aside>

        <!-- MAIN -->
        <main class="admin-main">
            <header class="admin-header">
                <h1>Configurações do Portfolio</h1>
            </header>

            <div class="admin-content">
                <form id="config-form" class="admin-form" style="max-width: 600px;">
                    
                    <div class="form-section">
                        <h3>Informações Pessoais</h3>
                        
                        <div class="form-group">
                            <label>Nome</label>
                            <input type="text" id="config-name" value="Freshzito" required>
                        </div>

                        <div class="form-group">
                            <label>Título/Cargo</label>
                            <input type="text" id="config-title" value="Creative Director & Visual Artist" required>
                        </div>

                        <div class="form-group">
                            <label>Subtítulo</label>
                            <input type="text" id="config-subtitle" value="Especializado em design, fotografia e direção de arte">
                        </div>

                        <div class="form-group">
                            <label>Bio</label>
                            <textarea id="config-bio" rows="4">Designer, ilustrador e fotógrafo com foco em criar experiências visuais autênticas e impactantes.

Atualmente diretor de arte na @backup.studio, trabalhando com marcas e projetos que valorizam criatividade e originalidade.</textarea>
                        </div>
                    </div>

                    <div class="form-section">
                        <h3>Estatísticas</h3>
                        
                        <div class="form-row">
                            <div class="form-group">
                                <label>Anos de Experiência</label>
                                <input type="text" id="config-years" value="5+">
                            </div>

                            <div class="form-group">
                                <label>Projetos Realizados</label>
                                <input type="text" id="config-projects" value="50+">
                            </div>

                            <div class="form-group">
                                <label>Seguidores</label>
                                <input type="text" id="config-followers" value="2.2k">
                            </div>
                        </div>
                    </div>

                    <div class="form-section">
                        <h3>Contato</h3>
                        
                        <div class="form-group">
                            <label>Instagram</label>
                            <input type="url" id="config-instagram" value="https://instagram.com/freshzito__">
                        </div>

                        <div class="form-group">
                            <label>Email</label>
                            <input type="email" id="config-email" value="contato@freshzito.com">
                        </div>

                        <div class="form-group">
                            <label>WhatsApp (número com DDI)</label>
                            <input type="tel" id="config-whatsapp" placeholder="5511999999999">
                        </div>
                    </div>

                    <div class="form-section">
                        <h3>Segurança</h3>
                        
                        <div class="form-group">
                            <label>Alterar Senha</label>
                            <input type="password" id="config-new-password" placeholder="Nova senha (deixe em branco para não alterar)">
                        </div>
                    </div>

                    <div class="form-actions">
                        <button type="submit" class="btn-primary">Salvar Configurações</button>
                    </div>
                </form>

                <div class="success-message" id="success-message" style="display:none; margin-top: 1rem; padding: 1rem; background: rgba(76, 175, 80, 0.1); border: 1px solid rgba(76, 175, 80, 0.3); color: #4caf50; border-radius: 4px;">
                    Configurações salvas com sucesso!
                </div>
            </div>
        </main>
    </div>

    <script src="/js/portfolio-admin.js"></script>
    <script>
        const form = document.getElementById('config-form');
        const successMsg = document.getElementById('success-message');

        // Carregar configurações
        async function loadConfig() {
            try {
                const res = await fetch('/api/portfolio/config');
                const data = await res.json();
                
                if (data) {
                    document.getElementById('config-name').value = data.name || 'Freshzito';
                    document.getElementById('config-title').value = data.title || '';
                    document.getElementById('config-subtitle').value = data.subtitle || '';
                    document.getElementById('config-bio').value = data.bio || '';
                    document.getElementById('config-years').value = data.stats?.years || '5+';
                    document.getElementById('config-projects').value = data.stats?.projects || '50+';
                    document.getElementById('config-followers').value = data.stats?.followers || '2.2k';
                    document.getElementById('config-instagram').value = data.contact?.instagram || '';
                    document.getElementById('config-email').value = data.contact?.email || '';
                    document.getElementById('config-whatsapp').value = data.contact?.whatsapp || '';
                }
            } catch (error) {
                console.error('Erro ao carregar configurações:', error);
            }
        }

        // Salvar configurações
        form.addEventListener('submit', async (e) => {
            e.preventDefault();

            const config = {
                name: document.getElementById('config-name').value,
                title: document.getElementById('config-title').value,
                subtitle: document.getElementById('config-subtitle').value,
                bio: document.getElementById('config-bio').value,
                stats: {
                    years: document.getElementById('config-years').value,
                    projects: document.getElementById('config-projects').value,
                    followers: document.getElementById('config-followers').value
                },
                contact: {
                    instagram: document.getElementById('config-instagram').value,
                    email: document.getElementById('config-email').value,
                    whatsapp: document.getElementById('config-whatsapp').value
                }
            };

            const newPassword = document.getElementById('config-new-password').value;
            if (newPassword) {
                config.newPassword = newPassword;
            }

            try {
                const res = await fetch('/api/portfolio/config', {
                    method: 'PUT',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(config)
                });

                if (res.ok) {
                    successMsg.style.display = 'block';
                    setTimeout(() => successMsg.style.display = 'none', 3000);
                    document.getElementById('config-new-password').value = '';
                }
            } catch (error) {
                alert('Erro ao salvar configurações');
            }
        });

        loadConfig();
    </script>
</body>
</html>
