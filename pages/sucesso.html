<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Pagamento Aprovado — VULTO</title>
  <link rel="icon" type="image/png" href="arquivos/logo.png" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet" />
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background: #080808;
      color: #f0f0f0;
      font-family: 'Inter', sans-serif;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 2rem;
    }
    .container {
      text-align: center;
      max-width: 600px;
    }
    .icon {
      width: 80px;
      height: 80px;
      margin: 0 auto 2rem;
      background: #00C853;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 3rem;
    }
    h1 {
      font-family: 'Bebas Neue', sans-serif;
      font-size: 2.5rem;
      letter-spacing: 0.1em;
      margin-bottom: 1rem;
    }
    p {
      font-size: 0.95rem;
      color: #999;
      margin-bottom: 2.5rem;
      line-height: 1.6;
    }
    .btn {
      display: inline-block;
      background: #f0f0f0;
      color: #080808;
      padding: 0.9rem 2rem;
      text-decoration: none;
      font-size: 0.75rem;
      font-weight: 700;
      letter-spacing: 0.15em;
      transition: all 0.2s;
    }
    .btn:hover {
      background: #fff;
      transform: translateY(-2px);
      box-shadow: 0 8px 20px rgba(255,255,255,0.1);
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="icon">✓</div>
    <h1>PAGAMENTO APROVADO!</h1>
    <p>Seu pedido foi confirmado e já está sendo processado. Você receberá um email com os detalhes da compra e o código de rastreamento em breve.</p>
    <a href="/" class="btn">VOLTAR PARA LOJA</a>
  </div>
</body>
</html>
