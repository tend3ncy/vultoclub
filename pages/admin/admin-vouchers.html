<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>VULTO GESTÃO — Inscritos Evento</title>
  <link rel="icon" type="image/png" href="../../arquivos/logo.png" />
  <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Inter:wght@300;400;500;600;700&family=JetBrains+Mono&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="../../css/style.css" />
  <link rel="stylesheet" href="../../css/admin.css" />
  <style>
    .page{padding:1.5rem;max-width:1200px;margin:0 auto}
    .page h1{font-family:var(--font-display);font-size:2rem;letter-spacing:.1em;margin-bottom:.25rem}
    .page .sub{color:var(--muted2);font-size:.8rem;margin-bottom:1.5rem}
    .stats{display:flex;gap:1rem;margin-bottom:1.5rem;flex-wrap:wrap}
    .stat{background:var(--bg2);border:1px solid var(--border);padding:1rem 1.25rem}
    .stat .n{font-family:var(--font-display);font-size:1.6rem}
    .stat .l{font-size:.6rem;letter-spacing:.12em;color:var(--muted2)}
    .filters{display:flex;gap:.5rem;margin-bottom:1rem;flex-wrap:wrap}
    .filters button{background:transparent;border:1px solid var(--border);color:var(--muted2);padding:.4rem .8rem;font-family:var(--font);font-size:.65rem;letter-spacing:.1em;cursor:pointer;transition:all .2s}
    .filters button:hover,.filters button.active{background:var(--white);color:#000;border-color:var(--white)}
    table{width:100%;border-collapse:collapse;font-size:.75rem}
    th{text-align:left;font-size:.6rem;letter-spacing:.12em;color:var(--muted);padding:.75rem .5rem;border-bottom:1px solid var(--border)}
    td{padding:.6rem .5rem;border-bottom:1px solid rgba(255,255,255,.04);color:var(--white)}
    tr:hover td{background:rgba(255,255,255,.02)}
    .badge{font-size:.55rem;padding:.15rem .4rem;border-radius:2px;font-weight:700;letter-spacing:.08em}
    .badge-expo{background:rgba(59,130,246,.15);color:#60a5fa}
    .badge-bat{background:rgba(251,191,36,.15);color:#fbbf24}
    .badge-checkin{background:rgba(34,197,94,.15);color:#22c55e}
    .badge-pending{background:rgba(148,163,184,.1);color:#94a3b8}
    .btn-del{background:transparent;border:1px solid rgba(239,68,68,.3);color:#ef4444;padding:.3rem .6rem;font-size:.6rem;cursor:pointer;transition:all .2s}
    .btn-del:hover{background:rgba(239,68,68,.1)}
    .empty{text-align:center;padding:3rem;color:var(--muted2)}
    @media(max-width:600px){table{font-size:.65rem}th,td{padding:.4rem .3rem}}
  </style>
</head>
<body>
  <nav class="nav">
    <div class="nav-logo"><a href="../../index.html"><img src="../../arquivos/logo.png" alt="VULTO" class="nav-logo-img" /></a></div>
    <ul class="nav-links">
      <li><a href="/gestao">GESTÃO</a></li>
      <li><a href="/gestao/inscritos" class="active">INSCRITOS</a></li>
      <li><a href="/gestao/chaveamento">CHAVEAMENTO</a></li>
      <li><a href="/gestao/checkin">CHECK-IN</a></li>
    </ul>
  </nav>

  <div class="page">
    <h1>INSCRITOS — EVENTO 22/08</h1>
    <p class="sub">Lista de todos os inscritos no encontro automotivo</p>

    <div class="stats" id="stats"></div>

    <!-- CONFIG VAGAS -->
    <div style="background:var(--bg2);border:1px solid var(--border);padding:1rem 1.25rem;margin-bottom:1.5rem;display:flex;gap:1rem;align-items:end;flex-wrap:wrap">
      <div style="flex:1;min-width:120px"><label style="display:block;font-size:.6rem;letter-spacing:.1em;color:var(--muted2);margin-bottom:.3rem">VAGAS EXPOSIÇÃO</label><input type="number" id="cfg-expo" value="100" min="1" style="width:100%;background:rgba(255,255,255,.03);border:1px solid var(--border);color:#fff;padding:.5rem;font-size:.85rem" /></div>
      <div style="flex:1;min-width:120px"><label style="display:block;font-size:.6rem;letter-spacing:.1em;color:var(--muted2);margin-bottom:.3rem">VAGAS BATALHA</label><input type="number" id="cfg-bat" value="16" min="1" style="width:100%;background:rgba(255,255,255,.03);border:1px solid var(--border);color:#fff;padding:.5rem;font-size:.85rem" /></div>
      <button onclick="saveConfig()" style="background:var(--white);color:#000;border:none;padding:.6rem 1.25rem;font-size:.65rem;font-weight:700;letter-spacing:.1em;cursor:pointer">SALVAR</button>
    </div>

    <div class="filters">
      <button class="active" onclick="filter('todos',this)">TODOS</button>
      <button onclick="filter('exposicao',this)">EXPOSIÇÃO</button>
      <button onclick="filter('batalha',this)">BATALHA</button>
      <button onclick="filter('checkin',this)">COM CHECK-IN</button>
    </div>

    <table>
      <thead><tr><th>CÓDIGO</th><th>TIPO</th><th>NOME</th><th>CARRO</th><th>PLACA</th><th>INSTAGRAM</th><th>STATUS</th><th>AÇÃO</th></tr></thead>
      <tbody id="tbody"></tbody>
    </table>
    <div class="empty" id="empty" style="display:none">Nenhum inscrito ainda.</div>
  </div>

  <script>
  let vouchers = [];
  let currentFilter = 'todos';

  async function load() {
    const r = await fetch('/api/vouchers.php');
    if (r.status === 401) { window.location.replace('/gestao/login'); return; }
    vouchers = await r.json();
    renderStats();
    render();
    loadConfig();
  }

  async function loadConfig() {
    try {
      const r = await fetch('/api/vouchers.php?action=config');
      const cfg = await r.json();
      document.getElementById('cfg-expo').value = cfg.maxExposicao || 100;
      document.getElementById('cfg-bat').value = cfg.maxBatalha || 16;
    } catch(e) {}
  }

  async function saveConfig() {
    const maxExposicao = document.getElementById('cfg-expo').value;
    const maxBatalha = document.getElementById('cfg-bat').value;
    await fetch('/api/vouchers.php?action=config', {method:'PUT',headers:{'Content-Type':'application/json'},body:JSON.stringify({maxExposicao,maxBatalha})});
    alert('Vagas atualizadas!');
  }

  function renderStats() {
    const expo = vouchers.filter(v=>v.tipo==='exposicao').length;
    const bat = vouchers.filter(v=>v.tipo==='batalha').length;
    const checkins = vouchers.filter(v=>v.checkin).length;
    document.getElementById('stats').innerHTML = `
      <div class="stat"><div class="n">${vouchers.length}</div><div class="l">TOTAL</div></div>
      <div class="stat"><div class="n">${expo}</div><div class="l">EXPOSIÇÃO</div></div>
      <div class="stat"><div class="n">${bat}</div><div class="l">BATALHA</div></div>
      <div class="stat"><div class="n">${checkins}</div><div class="l">CHECK-INS</div></div>
    `;
  }

  function render() {
    let filtered = vouchers;
    if (currentFilter === 'exposicao') filtered = vouchers.filter(v=>v.tipo==='exposicao');
    else if (currentFilter === 'batalha') filtered = vouchers.filter(v=>v.tipo==='batalha');
    else if (currentFilter === 'checkin') filtered = vouchers.filter(v=>v.checkin);

    const tbody = document.getElementById('tbody');
    const empty = document.getElementById('empty');

    if (!filtered.length) { tbody.innerHTML=''; empty.style.display='block'; return; }
    empty.style.display='none';

    tbody.innerHTML = filtered.map(v => `<tr>
      <td style="font-family:'JetBrains Mono',monospace;font-size:.65rem">${v.codigo}</td>
      <td><span class="badge ${v.tipo==='batalha'?'badge-bat':'badge-expo'}">${v.tipo==='batalha'?'BATALHA':'EXPO'}</span></td>
      <td>${v.nome}</td>
      <td>${v.carro}</td>
      <td style="text-transform:uppercase;font-weight:600">${v.placa}</td>
      <td>${v.instagram||'—'}</td>
      <td><span class="badge ${v.checkin?'badge-checkin':'badge-pending'}">${v.checkin?'✓ IN':'PENDENTE'}</span></td>
      <td><button class="btn-del" onclick="del('${v.id}')">REMOVER</button></td>
    </tr>`).join('');
  }

  function filter(f, btn) {
    currentFilter = f;
    document.querySelectorAll('.filters button').forEach(b=>b.classList.remove('active'));
    btn.classList.add('active');
    render();
  }

  async function del(id) {
    if (!confirm('Remover este inscrito?')) return;
    await fetch('/api/vouchers.php', {method:'DELETE',headers:{'Content-Type':'application/json'},body:JSON.stringify({id})});
    load();
  }

  load();
  setInterval(load, 15000);
  </script>
</body>
</html>
