<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>VULTO GESTÃO — Parcerias</title>
  <link rel="icon" type="image/png" href="../../arquivos/logo.png" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="../../css/style.css" />
  <link rel="stylesheet" href="../../css/admin.css" />
  <style>
    .page{padding:2rem;max-width:1000px;margin:0 auto}
    .page h1{font-family:var(--font-display);font-size:2.2rem;letter-spacing:.1em;margin-bottom:.25rem}
    .page .sub{color:var(--muted2);font-size:.85rem;margin-bottom:2rem}
    .add-form{background:var(--bg2);border:1px solid var(--border);padding:1.5rem;margin-bottom:2rem}
    .add-form h3{font-size:.72rem;letter-spacing:.15em;color:var(--muted2);margin-bottom:1rem}
    .form-grid{display:grid;grid-template-columns:1fr 1fr;gap:.75rem}
    .form-grid.full{grid-template-columns:1fr}
    .fg{display:flex;flex-direction:column;gap:.4rem}
    .fg label{font-size:.65rem;letter-spacing:.1em;color:var(--muted2)}
    .fg input,.fg select{background:rgba(255,255,255,.03);border:1px solid var(--border);color:var(--white);padding:.65rem .75rem;font-family:var(--font);font-size:.8rem;outline:none}
    .fg input:focus{border-color:rgba(255,255,255,.3)}
    .btn-add{background:var(--white);color:#000;border:none;padding:.7rem 1.5rem;font-family:var(--font);font-size:.68rem;font-weight:700;letter-spacing:.12em;cursor:pointer;margin-top:1rem}
    .btn-add:hover{opacity:.85}
    .parceiros-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:1rem}
    .parceiro-card{background:var(--bg2);border:1px solid var(--border);padding:1.25rem;position:relative}
    .parceiro-card .top{display:flex;align-items:center;gap:1rem;margin-bottom:1rem}
    .parceiro-card .avatar{width:50px;height:50px;border-radius:50%;overflow:hidden;background:rgba(255,255,255,.05);display:flex;align-items:center;justify-content:center;flex-shrink:0}
    .parceiro-card .avatar img{width:100%;height:100%;object-fit:cover}
    .parceiro-card .info h4{font-size:.85rem;margin-bottom:.2rem}
    .parceiro-card .info span{font-size:.7rem;color:var(--muted2)}
    .parceiro-card .meta{display:grid;grid-template-columns:1fr 1fr;gap:.5rem;font-size:.72rem;color:var(--muted2);margin-bottom:1rem}
    .parceiro-card .meta strong{color:var(--white)}
    .parceiro-card .actions{display:flex;gap:.5rem}
    .parceiro-card .actions button{flex:1;padding:.5rem;font-family:var(--font);font-size:.62rem;letter-spacing:.1em;cursor:pointer;border:1px solid var(--border);background:transparent;color:var(--muted2);transition:all .2s}
    .parceiro-card .actions button:hover{border-color:var(--white);color:var(--white)}
    .parceiro-card .actions .btn-del:hover{border-color:#ff4444;color:#ff4444}
    .badge-ativo{position:absolute;top:1rem;right:1rem;font-size:.55rem;letter-spacing:.1em;font-weight:700;padding:.2rem .5rem;border-radius:2px}
    .badge-ativo.on{background:rgba(34,197,94,.15);color:#22c55e}
    .badge-ativo.off{background:rgba(239,68,68,.15);color:#ef4444}
    .feedback{padding:.75rem 1rem;margin-bottom:1rem;font-size:.8rem;border-radius:2px;display:none}
    .feedback.success{background:rgba(34,197,94,.1);border:1px solid rgba(34,197,94,.3);color:#22c55e}
    .feedback.show{display:block}
    @media(max-width:600px){.form-grid{grid-template-columns:1fr}.parceiros-grid{grid-template-columns:1fr}}
  </style>
</head>
<body>
  <nav class="nav">
    <div class="nav-logo"><a href="../../index.html"><img src="../../arquivos/logo.png" alt="VULTO" class="nav-logo-img" /></a></div>
    <ul class="nav-links">
      <li><a href="admin.html">PRODUTOS</a></li>
      <li><a href="admin-estoque.html">ESTOQUE</a></li>
      <li><a href="admin-parcerias.html" class="active">PARCERIAS</a></li>
      <li><a href="admin-cupons.html">CUPONS</a></li>
      <li><a href="admin-config.html">CONFIG</a></li>
    </ul>
  </nav>

  <div class="page">
    <h1>PARCERIAS</h1>
    <p class="sub">Gerencie parceiros, logos e cupons de desconto exclusivos</p>
    <div id="feedback" class="feedback"></div>

    <!-- Form -->
    <div class="add-form">
      <h3>NOVO PARCEIRO</h3>
      <div class="form-grid">
        <div class="fg"><label>NOME</label><input type="text" id="p-nome" placeholder="Nome do parceiro" /></div>
        <div class="fg"><label>INSTAGRAM</label><input type="text" id="p-ig" placeholder="@parceiro" /></div>
        <div class="fg"><label>CONTATO (WhatsApp)</label><input type="text" id="p-contato" placeholder="11999999999" /></div>
        <div class="fg"><label>CUPOM DE DESCONTO</label><input type="text" id="p-cupom" placeholder="PARCEIRO10" style="text-transform:uppercase" /></div>
        <div class="fg"><label>DESCONTO (%)</label><input type="number" id="p-desconto" value="10" min="1" max="100" /></div>
        <div class="fg"><label>LOGO (imagem)</label><input type="file" id="p-logo" accept="image/*" /></div>
      </div>
      <button class="btn-add" onclick="addParceiro()">ADICIONAR PARCEIRO</button>
    </div>

    <!-- List -->
    <div class="parceiros-grid" id="parceiros-grid">
      <p style="color:var(--muted2)">Carregando...</p>
    </div>
  </div>

  <script>
  (function(){
    let parceiros = [];

    async function load() {
      try { const r = await fetch('/api/parcerias'); parceiros = await r.json(); render(); }
      catch(e) { document.getElementById('parceiros-grid').innerHTML='<p style="color:#ef4444">Erro</p>'; }
    }

    function render() {
      const grid = document.getElementById('parceiros-grid');
      if (!parceiros.length) { grid.innerHTML='<p style="color:var(--muted2)">Nenhum parceiro cadastrado.</p>'; return; }
      grid.innerHTML = parceiros.map(p => `
        <div class="parceiro-card">
          <span class="badge-ativo ${p.ativo?'on':'off'}">${p.ativo?'ATIVO':'INATIVO'}</span>
          <div class="top">
            <div class="avatar">${p.logo?'<img src="'+p.logo+'" />':'<span style="font-size:1.2rem">👤</span>'}</div>
            <div class="info">
              <h4>${p.nome}</h4>
              <span>${p.instagram||'Sem Instagram'}</span>
            </div>
          </div>
          <div class="meta">
            <div>Cupom: <strong>${p.cupom||'—'}</strong></div>
            <div>Desconto: <strong>${p.desconto}%</strong></div>
            <div>Contato: <strong>${p.contato||'—'}</strong></div>
            <div>Desde: <strong>${new Date(p.criadoEm).toLocaleDateString('pt-BR')}</strong></div>
          </div>
          <div class="actions">
            <button onclick="toggleAtivo('${p.id}',${!p.ativo})">${p.ativo?'DESATIVAR':'ATIVAR'}</button>
            <button class="btn-del" onclick="deleteParceiro('${p.id}')">REMOVER</button>
          </div>
        </div>
      `).join('');
    }

    window.addParceiro = async function() {
      const nome = document.getElementById('p-nome').value.trim();
      const ig = document.getElementById('p-ig').value.trim();
      const contato = document.getElementById('p-contato').value.trim();
      const cupom = document.getElementById('p-cupom').value.trim();
      const desconto = document.getElementById('p-desconto').value;
      const logoInput = document.getElementById('p-logo');

      if (!nome) { msg('Nome obrigatório','error'); return; }
      if (!cupom) { msg('Cupom obrigatório','error'); return; }

      let logo = '';
      if (logoInput.files[0]) {
        logo = await toBase64(logoInput.files[0]);
      }

      const r = await fetch('/api/parcerias', {
        method:'POST', headers:{'Content-Type':'application/json'},
        body: JSON.stringify({nome,instagram:ig,contato,cupom,desconto,logo})
      });
      const data = await r.json();
      if (data.success) {
        msg('Parceiro adicionado!','success');
        document.getElementById('p-nome').value='';
        document.getElementById('p-ig').value='';
        document.getElementById('p-contato').value='';
        document.getElementById('p-cupom').value='';
        document.getElementById('p-desconto').value='10';
        logoInput.value='';
        load();
      } else msg(data.error||'Erro','error');
    };

    window.toggleAtivo = async function(id, ativo) {
      await fetch('/api/parcerias',{method:'PUT',headers:{'Content-Type':'application/json'},body:JSON.stringify({id,ativo})});
      load();
    };

    window.deleteParceiro = async function(id) {
      if (!confirm('Remover este parceiro?')) return;
      await fetch('/api/parcerias',{method:'DELETE',headers:{'Content-Type':'application/json'},body:JSON.stringify({id})});
      load();
    };

    function toBase64(file) {
      return new Promise((res) => { const r=new FileReader(); r.onload=e=>res(e.target.result); r.readAsDataURL(file); });
    }

    function msg(text,type) {
      const el=document.getElementById('feedback');
      el.textContent=text; el.className='feedback '+type+' show';
      setTimeout(()=>{el.className='feedback';},3000);
    }

    load();
  })();
  </script>
</body>
</html>
