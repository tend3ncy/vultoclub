<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>VULTO — Admin</title>
  <link rel="icon" type="image/png" href="/arquivos/logo.png" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="/css/style.css" />
  <link rel="stylesheet" href="/css/admin.css" />
</head>
<body class="admin-body">

  <div class="admin-layout">

    <!-- SIDEBAR -->
    <aside class="sidebar">
      <div class="sidebar-logo">VULTO</div>
      <nav class="sidebar-nav">
        <a href="/gestao" class="sidebar-link active" id="nav-products">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="7" height="7"/><rect x="14" y="3" width="7" height="7"/><rect x="14" y="14" width="7" height="7"/><rect x="3" y="14" width="7" height="7"/></svg>
          Produtos
        </a>
        <a href="/gestao/links" class="sidebar-link" id="nav-links">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M10 13a5 5 0 0 0 7.54.54l3-3a5 5 0 0 0-7.07-7.07l-1.72 1.71"/><path d="M14 11a5 5 0 0 0-7.54-.54l-3 3a5 5 0 0 0 7.07 7.07l1.71-1.71"/></svg>
          Links
        </a>
        <a href="/gestao/eventos" class="sidebar-link" id="nav-eventos">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="4" width="18" height="18" rx="2" ry="2"/><line x1="16" y1="2" x2="16" y2="6"/><line x1="8" y1="2" x2="8" y2="6"/><line x1="3" y1="10" x2="21" y2="10"/></svg>
          Eventos
        </a>
                        <a href="/gestao/pedidos" class="sidebar-link">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/><line x1="16" y1="13" x2="8" y2="13"/><line x1="16" y1="17" x2="8" y2="17"/></svg>
          Pedidos
        </a>
        <a href="/gestao/parcerias" class="sidebar-link">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M23 21v-2a4 4 0 0 0-3-3.87"/><path d="M16 3.13a4 4 0 0 1 0 7.75"/></svg>
          Parcerias
        </a>
        <a href="/gestao/cupons" class="sidebar-link">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 16V8a2 2 0 0 0-1-1.73l-7-4a2 2 0 0 0-2 0l-7 4A2 2 0 0 0 3 8v8a2 2 0 0 0 1 1.73l7 4a2 2 0 0 0 2 0l7-4A2 2 0 0 0 21 16z"/><polyline points="7.5 4.21 12 6.81 16.5 4.21"/><polyline points="7.5 19.79 7.5 14.6 3 12"/><polyline points="21 12 16.5 14.6 16.5 19.79"/><polyline points="3.27 6.96 12 12.01 20.73 6.96"/><line x1="12" y1="22.08" x2="12" y2="12"/></svg>
          Cupons
        </a>
        <a href="/gestao/config" class="sidebar-link">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="3"/><path d="M12 1v6m0 6v6m5.2-13.2l-4.2 4.2m0 6l4.2 4.2M23 12h-6m-6 0H1m18.2 5.2l-4.2-4.2m0-6l4.2-4.2"/></svg>
          Configurações
        </a>
        <a href="/" class="sidebar-link">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><polyline points="9 22 9 12 15 12 15 22"/></svg>
          Ver Loja
        </a>
        <button class="sidebar-link sidebar-logout" onclick="logout()">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><polyline points="16 17 21 12 16 7"/><line x1="21" y1="12" x2="9" y2="12"/></svg>
          Sair
        </button>
      </nav>
      <div class="sidebar-stats" id="sidebar-stats"></div>
    </aside>

    <!-- MAIN -->
    <main class="admin-main">
      <div class="admin-header">
        <h1>Produtos</h1>
        <button class="btn-add" onclick="openForm()">+ NOVO PRODUTO</button>
      </div>

      <!-- TABELA -->
      <div class="admin-table-wrap">
        <table class="admin-table" id="admin-table">
          <thead>
            <tr>
              <th>IMAGEM</th>
              <th>NOME</th>
              <th>CATEGORIA</th>
              <th>PREÇO</th>
              <th>DESTAQUE</th>
              <th>AÇÕES</th>
            </tr>
          </thead>
          <tbody id="admin-tbody">
            <!-- renderizado via JS -->
          </tbody>
        </table>
        <div class="admin-empty" id="admin-empty" style="display:none">
          <p>Nenhum produto ainda. Clique em <strong>+ NOVO PRODUTO</strong> para começar.</p>
        </div>
      </div>
    </main>
  </div>

  <!-- MODAL FORM -->
  <div class="modal-overlay" id="form-overlay" onclick="closeForm()">
    <div class="form-modal" onclick="event.stopPropagation()">
      <div class="form-modal-header">
        <h2 id="form-title">Novo Produto</h2>
        <button class="modal-close" onclick="closeForm()">✕</button>
      </div>

      <form id="product-form" onsubmit="saveProduct(event)">
        <input type="hidden" id="field-id" />

        <div class="form-row">
          <div class="form-group">
            <label for="field-name">Nome do produto *</label>
            <input type="text" id="field-name" placeholder="Ex: CAMISETA BURN YOUR DREAMS" required />
          </div>
          <div class="form-group">
            <label for="field-category">Categoria *</label>
            <input type="text" id="field-category" placeholder="Ex: Camisetas" required list="cat-datalist" />
            <datalist id="cat-datalist"></datalist>
          </div>
        </div>

        <div class="form-row">
          <div class="form-group">
            <label for="field-price">Preço (R$) *</label>
            <input type="number" id="field-price" placeholder="159.90" step="0.01" min="0" required />
          </div>
          <div class="form-group form-group--check">
            <label class="check-label">
              <input type="checkbox" id="field-badge" />
              <span>Marcar como destaque</span>
            </label>
            <label class="check-label">
              <input type="checkbox" id="field-new" />
              <span>Marcar como NOVO</span>
            </label>
          </div>
        </div>

        <div class="form-group">
          <label for="field-desc">Descrição</label>
          <textarea id="field-desc" rows="3" placeholder="Descreva o produto..."></textarea>
        </div>

        <div class="form-group">
          <label>Imagens do produto</label>
          <div class="images-manager">
            <div class="images-grid" id="images-grid">
              <div class="add-image-card" onclick="document.getElementById('add-img-file').click()">
                <svg width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                  <line x1="12" y1="5" x2="12" y2="19"></line>
                  <line x1="5" y1="12" x2="19" y2="12"></line>
                </svg>
                <span>Adicionar Imagem</span>
              </div>
            </div>
            <input type="file" id="add-img-file" accept="image/*" onchange="addImageToProduct(event)" style="display:none" multiple />
            <div class="img-url-input">
              <input type="url" id="field-img-url" placeholder="Ou cole a URL da imagem" onchange="addImageUrl(event)" />
            </div>
          </div>
        </div>

        <div class="form-actions">
          <button type="button" class="btn-cancel" onclick="closeForm()">CANCELAR</button>
          <button type="submit" class="btn-save" id="btn-save">SALVAR PRODUTO</button>
        </div>
      </form>
    </div>
  </div>

  <!-- CONFIRM DELETE -->
  <div class="modal-overlay" id="confirm-overlay" onclick="closeConfirm()">
    <div class="confirm-modal" onclick="event.stopPropagation()">
      <h3>Remover produto?</h3>
      <p>Esta ação não pode ser desfeita.</p>
      <div class="confirm-actions">
        <button class="btn-cancel" onclick="closeConfirm()">CANCELAR</button>
        <button class="btn-delete-confirm" id="btn-delete-confirm" onclick="doDelete()">REMOVER</button>
      </div>
    </div>
  </div>

  <script>
    // Verifica sessão no servidor
    fetch('api/auth').then(r => r.json()).then(d => {
      if (!d.authenticated) window.location.replace('login.html');
    });
    async function logout() {
      await fetch('api/logout', { method: 'POST' });
      window.location.replace('login.html');
    }
  </script>
  <script src="/js/app.js"></script>
  <script src="/js/admin.js"></script>
</body>
</html>
