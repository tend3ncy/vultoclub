<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <link rel="stylesheet" href="/css/style.css" />
  <link rel="stylesheet" href="/css/admin.css" />
</head>
<body class="admin-body">

    <aside class="sidebar">

          Produtos
        </a>
        <a href="/gestao/links" class="sidebar-link active">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M10 13a5 5 0 0 0 7.54.54l3-3a5 5 0 0 0-7.07-7.07l-1.72 1.71"/><path d="M14 11a5 5 0 0 0-7.54-.54l-3 3a5 5 0 0 0 7.07 7.07l1.71-1.71"/></svg>
          Links
        </a>
        <a href="/gestao/eventos" class="sidebar-link">

          Eventos
        </a>
                        <a href="/gestao/pedidos" class="sidebar-link">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/><line x1="16" y1="13" x2="8" y2="13"/><line x1="16" y1="17" x2="8" y2="17"/></svg>
          Pedidos
        </a>
        <a href="/gestao/parcerias" class="sidebar-link">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M23 21v-2a4 4 0 0 0-3-3.87"/><path d="M16 3.13a4 4 0 0 1 0 7.75"/></svg>
          Parcerias
        </a>
        <a href="/gestao/cupons" class="sidebar-link">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 16V8a2 2 0 0 0-1-1.73l-7-4a2 2 0 0 0-2 0l-7 4A2 2 0 0 0 3 8v8a2 2 0 0 0 1 1.73l7 4a2 2 0 0 0 2 0l7-4A2 2 0 0 0 21 16z"/><polyline points="7.5 4.21 12 6.81 16.5 4.21"/><polyline points="7.5 19.79 7.5 14.6 3 12"/><polyline points="21 12 16.5 14.6 16.5 19.79"/><polyline points="3.27 6.96 12 12.01 20.73 6.96"/><line x1="12" y1="22.08" x2="12" y2="12"/></svg>
          Cupons
        </a>
                <a href="/gestao/inscritos" class="sidebar-link">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M16 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/><circle cx="8.5" cy="7" r="4"/><line x1="20" y1="8" x2="20" y2="14"/><line x1="23" y1="11" x2="17" y2="11"/></svg>
          Evento
        </a>
        <a href="/gestao/config" class="sidebar-link">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="3"/><path d="M12 1v6m0 6v6m5.2-13.2l-4.2 4.2m0 6l4.2 4.2M23 12h-6m-6 0H1m18.2 5.2l-4.2-4.2m0-6l4.2-4.2"/></svg>
          Configurações
        </a>
        <a href="/" class="sidebar-link">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><polyline points="9 22 9 12 15 12 15 22"/></svg>
          Ver Loja
        </a>
        <button class="sidebar-link sidebar-logout" onclick="logout()">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><polyline points="16 17 21 12 16 7"/><line x1="21" y1="12" x2="9" y2="12"/></svg>
          Sair
        </button>
      </nav>
    </aside>

    <main class="admin-main">
      <div class="admin-header">
        <h1>Links</h1>
        <a href="/links.html" target="_blank" class="btn-add" style="background:rgba(255,255,255,0.08);color:#f0f0f0">VER PÁGINA</a>
      </div>

      <form id="links-form" onsubmit="saveLinks(event)">
        <div class="form-group">
          <label for="bio">Bio / Descrição</label>
          <textarea id="bio" rows="2" placeholder="Underground, ágeis e invisíveis..."></textarea>
        </div>

        <div class="links-list" id="links-list"></div>

        <button type="button" class="btn-add-link" onclick="addLinkField()">+ ADICIONAR LINK</button>

        <div class="form-actions" style="margin-top:2rem">
          <button type="submit" class="btn-save">SALVAR ALTERAÇÕES</button>
        </div>
      </form>
    </main>
  </div>

  <script>
    fetch('api/auth').then(r => r.json()).then(d => {
      if (!d.authenticated) window.location.replace('login.html');
    });
    async function logout() {
      await fetch('api/logout', { method: 'POST' });
      window.location.replace('login.html');
    }

    let linksData = [];

    async function loadLinks() {
      const res = await fetch('api/links');
      const data = await res.json();
      document.getElementById('bio').value = data.bio || '';
      linksData = data.links || [];
      renderLinks();
    }

    function renderLinks() {
      const list = document.getElementById('links-list');
      list.innerHTML = linksData.map((l, i) => `
        <div class="link-item">
          <div class="link-item-header">
            <span class="link-item-num">#${i + 1}</span>
            <button type="button" class="btn-remove" onclick="removeLink(${i})">✕</button>
          </div>
          <div class="form-row">
            <div class="form-group">
              <label>Título</label>
              <input type="text" value="${escHtml(l.title)}" onchange="updateLink(${i}, 'title', this.value)" placeholder="Ex: Loja Vulto" />
            </div>
            <div class="form-group">
              <label>Ícone (emoji)</label>
              <input type="text" value="${escHtml(l.icon || '')}" onchange="updateLink(${i}, 'icon', this.value)" placeholder="🔥" maxlength="2" />
            </div>
          </div>
          <div class="form-group">
            <label>URL</label>
            <input type="url" value="${escHtml(l.url)}" onchange="updateLink(${i}, 'url', this.value)" placeholder="https://..." />
          </div>
          <div class="form-row">
            <label class="check-label">
              <input type="checkbox" ${l.active ? 'checked' : ''} onchange="updateLink(${i}, 'active', this.checked)" />
              <span>Ativo</span>
            </label>
            <label class="check-label">
              <input type="checkbox" ${l.featured ? 'checked' : ''} onchange="updateLink(${i}, 'featured', this.checked)" />
              <span>Destaque</span>
            </label>
          </div>
        </div>
      `).join('');
    }

    function addLinkField() {
      linksData.push({ title: '', url: '', icon: '', active: true, featured: false });
      renderLinks();
    }

    function removeLink(i) {
      linksData.splice(i, 1);
      renderLinks();
    }

    function updateLink(i, field, value) {
      linksData[i][field] = value;
    }

    async function saveLinks(e) {
      e.preventDefault();
      const btn = e.target.querySelector('.btn-save');
      btn.disabled = true;
      btn.textContent = 'SALVANDO...';

      const data = {
        bio: document.getElementById('bio').value.trim(),
        links: linksData.filter(l => l.title && l.url),
      };

      await fetch('api/links', {
        method: 'PUT',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(data),
      });

      btn.textContent = 'SALVO ✓';
      setTimeout(() => {
        btn.disabled = false;
        btn.textContent = 'SALVAR ALTERAÇÕES';
      }, 1500);
    }

    function escHtml(str) {
      return String(str).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
    }

    loadLinks();
  </script>

  <style>
    .links-list { display: flex; flex-direction: column; gap: 1.5rem; margin-bottom: 1.5rem; }
    .link-item {
      background: rgba(255,255,255,0.02);
      border: 1px solid rgba(255,255,255,0.06);
      padding: 1.5rem;
      border-radius: 8px;
    }
    .link-item-header {
      display: flex; justify-content: space-between; align-items: center;
      margin-bottom: 1rem;
    }
    .link-item-num {
      font-family: 'Bebas Neue', sans-serif;
      font-size: 1.2rem;
      color: #666;
      letter-spacing: 0.1em;
    }
    .btn-remove {
      background: rgba(255,60,60,0.1);
      border: 1px solid rgba(255,60,60,0.2);
      color: #ff6060;
      width: 28px; height: 28px;
      border-radius: 50%;
      cursor: pointer;
      font-size: 0.9rem;
      transition: all 0.2s;
    }
    .btn-remove:hover { background: rgba(255,60,60,0.2); }
    .btn-add-link {
      width: 100%;
      background: rgba(255,255,255,0.04);
      border: 1px dashed rgba(255,255,255,0.15);
      color: #888;
      padding: 0.9rem;
      font-family: 'Inter', sans-serif;
      font-size: 0.72rem;
      font-weight: 700;
      letter-spacing: 0.15em;
      cursor: pointer;
      transition: all 0.2s;
    }
    .btn-add-link:hover {
      background: rgba(255,255,255,0.06);
      border-color: rgba(255,255,255,0.25);
      color: #f0f0f0;
    }
  </style>
</body>
</html>
