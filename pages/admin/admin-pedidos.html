<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>VULTO GESTÃO — Pedidos</title>
  <link rel="icon" type="image/png" href="../../arquivos/logo.png" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="../../css/style.css" />
  <link rel="stylesheet" href="../../css/admin.css" />
  <style>
    .page{padding:1.5rem;max-width:100%;overflow-x:auto}
    .page h1{font-family:var(--font-display);font-size:2rem;letter-spacing:.1em;margin-bottom:.25rem}
    .page .sub{color:var(--muted2);font-size:.8rem;margin-bottom:1.5rem}
    .stats{display:flex;gap:1rem;margin-bottom:1.5rem;flex-wrap:wrap}
    .stat{background:var(--bg2);border:1px solid var(--border);padding:1rem 1.25rem;min-width:120px}
    .stat .n{font-family:var(--font-display);font-size:1.8rem;letter-spacing:.05em}
    .stat .l{font-size:.6rem;letter-spacing:.12em;color:var(--muted2);margin-top:.15rem}
    /* Kanban */
    .kanban{display:flex;gap:1rem;overflow-x:auto;padding-bottom:1rem;min-height:60vh}
    .kanban-col{min-width:280px;max-width:320px;flex:1;background:rgba(255,255,255,.02);border:1px solid var(--border);display:flex;flex-direction:column}
    .kanban-col-header{padding:.85rem 1rem;border-bottom:1px solid var(--border);display:flex;justify-content:space-between;align-items:center}
    .kanban-col-header h3{font-size:.65rem;letter-spacing:.15em;color:var(--muted2)}
    .kanban-col-header .count{font-size:.7rem;color:var(--muted);background:rgba(255,255,255,.05);padding:.2rem .5rem;border-radius:2px}
    .kanban-col-body{flex:1;padding:.75rem;overflow-y:auto;display:flex;flex-direction:column;gap:.75rem}
    .k-card{background:var(--bg);border:1px solid var(--border);padding:1rem;cursor:pointer;transition:border-color .2s}
    .k-card:hover{border-color:rgba(255,255,255,.2)}
    .k-card .num{font-family:monospace;font-size:.7rem;color:var(--muted);margin-bottom:.4rem}
    .k-card .name{font-size:.8rem;font-weight:600;margin-bottom:.3rem}
    .k-card .prod{font-size:.7rem;color:var(--muted2);margin-bottom:.5rem}
    .k-card .meta{display:flex;justify-content:space-between;font-size:.62rem;color:var(--muted)}
    .k-card .tag{font-size:.55rem;font-weight:700;letter-spacing:.08em;padding:.15rem .4rem;border-radius:2px;display:inline-block;margin-top:.4rem}
    .tag-novo{background:rgba(59,130,246,.15);color:#60a5fa}
    .tag-pago{background:rgba(168,85,247,.15);color:#a855f7}
    .tag-producao{background:rgba(251,191,36,.15);color:#fbbf24}
    .tag-pronto{background:rgba(34,197,94,.15);color:#22c55e}
    .tag-enviado{background:rgba(6,182,212,.15);color:#06b6d4}
    .tag-entregue{background:rgba(148,163,184,.1);color:#94a3b8}

    /* Detail modal */
    .detail-overlay{position:fixed;inset:0;background:rgba(0,0,0,.9);display:none;align-items:flex-start;justify-content:center;z-index:300;padding:2rem;overflow-y:auto}
    .detail-overlay.open{display:flex}
    .detail-modal{background:var(--bg2);border:1px solid var(--border);max-width:650px;width:100%;margin-top:2rem}
    .dm-header{display:flex;justify-content:space-between;align-items:center;padding:1.25rem 1.5rem;border-bottom:1px solid var(--border)}
    .dm-header h2{font-family:var(--font-display);font-size:1.3rem;letter-spacing:.08em}
    .dm-close{background:none;border:none;color:var(--muted2);font-size:1.3rem;cursor:pointer}
    .dm-body{padding:1.5rem}
    .dm-section{margin-bottom:1.5rem}
    .dm-section h4{font-size:.65rem;letter-spacing:.15em;color:var(--muted);margin-bottom:.75rem}
    .dm-row{display:flex;justify-content:space-between;padding:.4rem 0;border-bottom:1px solid rgba(255,255,255,.04);font-size:.78rem}
    .dm-row .lbl{color:var(--muted2)}
    .dm-row .val{color:var(--white);font-weight:500}
    .dm-actions{display:flex;gap:.5rem;flex-wrap:wrap;margin-top:1rem}
    .dm-actions select,.dm-actions input{background:rgba(255,255,255,.03);border:1px solid var(--border);color:var(--white);padding:.5rem .75rem;font-size:.75rem;font-family:var(--font)}
    .dm-actions button{padding:.5rem 1rem;font-family:var(--font);font-size:.65rem;letter-spacing:.1em;font-weight:700;cursor:pointer;border:none;transition:all .2s}
    .btn-status{background:var(--white);color:#000}
    .btn-status:hover{opacity:.85}
    .btn-wpp{background:#25D366;color:#fff}
    .btn-wpp:hover{background:#20BA5A}
    .dm-history{max-height:200px;overflow-y:auto}
    .dm-history-item{padding:.5rem 0;border-bottom:1px solid rgba(255,255,255,.04);font-size:.72rem}
    .dm-history-item .time{color:var(--muted);font-size:.62rem}

    @media(max-width:900px){.kanban{flex-direction:column}.kanban-col{min-width:100%;max-width:100%}}
  </style>
</head>
<body>
  <nav class="nav">
    <div class="nav-logo"><a href="../../index.html"><img src="../../arquivos/logo.png" alt="VULTO" class="nav-logo-img" /></a></div>
    <ul class="nav-links">
      <li><a href="admin.html">PRODUTOS</a></li>
      <li><a href="admin-pedidos.html" class="active">PEDIDOS</a></li>
      <li><a href="admin-estoque.html">ESTOQUE</a></li>
      <li><a href="admin-config.html">CONFIG</a></li>
    </ul>
  </nav>

  <div class="page">
    <h1>GESTÃO DE PEDIDOS</h1>
    <p class="sub">Kanban de produção — do pedido à entrega</p>

    <div class="stats" id="stats"></div>

    <div class="kanban" id="kanban"></div>
  </div>

  <!-- DETAIL MODAL -->
  <div class="detail-overlay" id="detail-overlay">
    <div class="detail-modal">
      <div class="dm-header">
        <h2 id="dm-title">PEDIDO</h2>
        <button class="dm-close" onclick="closeDetail()">✕</button>
      </div>
      <div class="dm-body" id="dm-body"></div>
    </div>
  </div>

  <script>
  (function(){
    const STATUSES = [
      {key:'novo', label:'NOVOS', color:'tag-novo'},
      {key:'pago', label:'PAGO', color:'tag-pago'},
      {key:'producao', label:'EM PRODUÇÃO', color:'tag-producao'},
      {key:'pronto', label:'PRONTO', color:'tag-pronto'},
      {key:'enviado', label:'ENVIADO', color:'tag-enviado'},
      {key:'entregue', label:'ENTREGUE', color:'tag-entregue'}
    ];

    let pedidos = [];
    let selected = null;

    async function load() {
      const r = await fetch('/api/pedidos');
      if (r.status === 401) { window.location.replace('/gestao/login'); return; }
      pedidos = await r.json();
      renderStats();
      renderKanban();
    }

    function renderStats() {
      const el = document.getElementById('stats');
      const total = pedidos.length;
      const counts = {};
      STATUSES.forEach(s => counts[s.key] = 0);
      pedidos.forEach(p => { if(counts[p.status] !== undefined) counts[p.status]++; });
      el.innerHTML = `<div class="stat"><div class="n">${total}</div><div class="l">TOTAL</div></div>` +
        STATUSES.slice(0,4).map(s => `<div class="stat"><div class="n">${counts[s.key]}</div><div class="l">${s.label}</div></div>`).join('');
    }

    function renderKanban() {
      const el = document.getElementById('kanban');
      el.innerHTML = STATUSES.map(s => {
        const items = pedidos.filter(p => p.status === s.key);
        return `
          <div class="kanban-col">
            <div class="kanban-col-header">
              <h3>${s.label}</h3>
              <span class="count">${items.length}</span>
            </div>
            <div class="kanban-col-body">
              ${items.map(p => renderCard(p, s.color)).join('')}
              ${items.length === 0 ? '<div style="text-align:center;padding:2rem;color:#333;font-size:.7rem;">Vazio</div>' : ''}
            </div>
          </div>
        `;
      }).join('');
    }

    function renderCard(p, tagClass) {
      const itensStr = (p.itens||[]).map(i => i.name + (i.size ? ' ('+i.size+')' : '')).join(', ');
      const date = new Date(p.criadoEm).toLocaleDateString('pt-BR');
      return `
        <div class="k-card" onclick="openDetail('${p.id}')">
          <div class="num">${p.numero} · ${date}</div>
          <div class="name">${p.cliente.nome}</div>
          <div class="prod">${itensStr || 'Sem itens'}</div>
          <div class="meta">
            <span>R$ ${(p.total||0).toFixed(2).replace('.',',')}</span>
            <span>${p.cliente.telefone}</span>
          </div>
        </div>
      `;
    }

    window.openDetail = function(id) {
      selected = pedidos.find(p => p.id === id);
      if (!selected) return;
      document.getElementById('dm-title').textContent = 'PEDIDO #' + selected.numero;
      const s = selected;
      const itensHtml = (s.itens||[]).map(i => `<div class="dm-row"><span class="lbl">${i.name}${i.size?' ('+i.size+')':''}</span><span class="val">x${i.qty} · R$ ${(i.price*i.qty).toFixed(2).replace('.',',')}</span></div>`).join('');
      const histHtml = (s.historico||[]).map(h => `<div class="dm-history-item"><span class="time">${new Date(h.data).toLocaleString('pt-BR')}</span> — <strong>${h.status}</strong> · ${h.nota||''}</div>`).join('');

      document.getElementById('dm-body').innerHTML = `
        <div class="dm-section">
          <h4>CLIENTE</h4>
          <div class="dm-row"><span class="lbl">Nome</span><span class="val">${s.cliente.nome}</span></div>
          <div class="dm-row"><span class="lbl">Email</span><span class="val">${s.cliente.email}</span></div>
          <div class="dm-row"><span class="lbl">Telefone</span><span class="val">${s.cliente.telefone}</span></div>
        </div>
        <div class="dm-section">
          <h4>ITENS</h4>
          ${itensHtml}
          <div class="dm-row" style="border-top:1px solid rgba(255,255,255,.08);margin-top:.5rem;padding-top:.5rem"><span class="lbl">TOTAL</span><span class="val" style="font-size:.9rem">R$ ${(s.total||0).toFixed(2).replace('.',',')}</span></div>
          ${s.cupom ? '<div class="dm-row"><span class="lbl">Cupom</span><span class="val">'+s.cupom+'</span></div>' : ''}
        </div>
        <div class="dm-section">
          <h4>ENTREGA</h4>
          <div class="dm-row"><span class="lbl">CEP</span><span class="val">${s.entrega.cep}</span></div>
          <div class="dm-row"><span class="lbl">Endereço</span><span class="val">${s.entrega.endereco}${s.entrega.complemento?', '+s.entrega.complemento:''}</span></div>
          <div class="dm-row"><span class="lbl">Bairro</span><span class="val">${s.entrega.bairro||'—'}</span></div>
          <div class="dm-row"><span class="lbl">Cidade/UF</span><span class="val">${s.entrega.cidade||''} ${s.entrega.estado||''}</span></div>
          ${s.entrega.placa ? '<div class="dm-row"><span class="lbl">Placa</span><span class="val" style="text-transform:uppercase;font-weight:700">'+s.entrega.placa+'</span></div>' : ''}
          ${s.entrega.modeloCarro ? '<div class="dm-row"><span class="lbl">Carro</span><span class="val">'+s.entrega.modeloCarro+'</span></div>' : ''}
          <div class="dm-row"><span class="lbl">Tipo</span><span class="val">${s.entrega.tipo==='evento'?'🏁 Retirada no Evento':'📦 Envio'}</span></div>
          ${s.rastreio ? '<div class="dm-row"><span class="lbl">Rastreio</span><span class="val" style="color:#06b6d4">'+s.rastreio+'</span></div>' : ''}
        </div>
        <div class="dm-section">
          <h4>AÇÕES</h4>
          <div class="dm-actions">
            <select id="new-status">
              <option value="">Mudar status...</option>
              <option value="pago">Pago</option>
              <option value="producao">Em Produção</option>
              <option value="pronto">Pronto</option>
              <option value="enviado">Enviado</option>
              <option value="entregue">Entregue</option>
            </select>
            <button class="btn-status" onclick="changeStatus()">ATUALIZAR</button>
          </div>
          <div class="dm-actions" style="margin-top:.75rem">
            <input type="text" id="rastreio-input" placeholder="Código de rastreio" value="${s.rastreio||''}" style="flex:1" />
            <button class="btn-status" onclick="saveRastreio()">SALVAR RASTREIO</button>
          </div>
          <div class="dm-actions" style="margin-top:.75rem">
            <button class="btn-wpp" onclick="whatsappCliente()">WHATSAPP</button>
          </div>
        </div>
        <div class="dm-section">
          <h4>HISTÓRICO</h4>
          <div class="dm-history">${histHtml || '<div style="color:#555;font-size:.72rem">Sem histórico</div>'}</div>
        </div>
      `;
      document.getElementById('detail-overlay').classList.add('open');
    };

    window.closeDetail = function() {
      document.getElementById('detail-overlay').classList.remove('open');
      selected = null;
    };

    window.changeStatus = async function() {
      const status = document.getElementById('new-status').value;
      if (!status || !selected) return;
      await fetch('/api/pedidos', {method:'PUT', headers:{'Content-Type':'application/json'}, body:JSON.stringify({id:selected.id, status})});
      load();
      closeDetail();
    };

    window.saveRastreio = async function() {
      const rastreio = document.getElementById('rastreio-input').value.trim();
      if (!selected) return;
      await fetch('/api/pedidos', {method:'PUT', headers:{'Content-Type':'application/json'}, body:JSON.stringify({id:selected.id, rastreio})});
      load();
      closeDetail();
    };

    window.whatsappCliente = function() {
      if (!selected) return;
      const phone = selected.cliente.telefone.replace(/\D/g,'');
      const statusMsg = {novo:'Seu pedido foi recebido',pago:'Pagamento confirmado',producao:'Sua peça está em produção',pronto:'Sua peça ficou pronta',enviado:'Seu pedido foi enviado! Rastreio: '+(selected.rastreio||'em breve'),entregue:'Pedido entregue'};
      const msg = encodeURIComponent('Fala ${selected.cliente.nome.split(" ")[0]}! Aqui é da Vulto Club.\n\n' + (statusMsg[selected.status]||'Atualização do pedido') + '\n\nPedido: #' + selected.numero);
      window.open('https://wa.me/55'+phone+'?text='+msg, '_blank');
    };

    load();
    setInterval(load, 30000); // refresh a cada 30s
  })();
  </script>
</body>
</html>
