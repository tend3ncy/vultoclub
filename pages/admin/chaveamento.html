<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Chaveamento — Batalha de Ronco</title>
  <link rel="icon" type="image/png" href="../../arquivos/logo.png" />
  <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet" />
  <style>
    *{box-sizing:border-box;margin:0;padding:0}
    body{background:#080808;color:#f0f0f0;font-family:'Inter',sans-serif;min-height:100vh;padding:1.5rem;overflow-x:auto}
    h1{font-family:'Bebas Neue',sans-serif;font-size:2rem;letter-spacing:.1em;text-align:center;margin-bottom:.25rem}
    .sub{text-align:center;color:#888;font-size:.8rem;margin-bottom:2rem}
    .bracket{display:flex;gap:1.5rem;justify-content:flex-start;align-items:center;min-width:750px;padding:1rem 0}
    .round{display:flex;flex-direction:column;gap:.75rem;align-items:center}
    .round-title{font-size:.65rem;letter-spacing:.18em;color:#fbbf24;margin-bottom:.5rem;text-align:center;font-weight:700}
    .match{background:rgba(255,255,255,.03);border:1px solid rgba(255,255,255,.08);width:155px;overflow:hidden;border-radius:4px}
    .match-player{padding:.75rem .85rem;font-size:.78rem;cursor:pointer;transition:all .15s;display:flex;justify-content:space-between;align-items:center;border-bottom:1px solid rgba(255,255,255,.05);-webkit-tap-highlight-color:transparent}
    .match-player:last-child{border-bottom:none}
    .match-player:hover{background:rgba(255,255,255,.05)}
    .match-player:active{background:rgba(251,191,36,.08)}
    .match-player.winner{background:rgba(251,191,36,.12);color:#fbbf24;font-weight:700}
    .match-player .name{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:75%}
    .match-player .check{font-size:.8rem}
    .champion{text-align:center;margin-top:2rem;padding:2rem;border:2px solid #fbbf24;background:rgba(251,191,36,.05);max-width:300px;margin-left:auto;margin-right:auto;display:none}
    .champion.show{display:block}
    .champion h2{font-family:'Bebas Neue',sans-serif;font-size:1.8rem;color:#fbbf24;letter-spacing:.1em}
    .champion p{font-size:.85rem;margin-top:.5rem}
    .actions{text-align:center;margin-top:1.5rem}
    .actions button{background:transparent;border:1px solid rgba(255,255,255,.15);color:#888;padding:.5rem 1.25rem;font-family:'Inter',sans-serif;font-size:.65rem;letter-spacing:.1em;cursor:pointer;margin:0 .25rem;transition:all .2s}
    .actions button:hover{border-color:#fff;color:#fff}
    .btn-reset{border-color:rgba(239,68,68,.3)!important;color:#ef4444!important}
  </style>
</head>
<body>
  <h1>BATALHA DE RONCO</h1>
  <p class="sub">Chaveamento eliminatório — 16 participantes</p>

  <div class="bracket" id="bracket"></div>
  <div class="champion" id="champion"><h2>🏆 CAMPEÃO</h2><p id="champion-name"></p></div>

  <div class="actions">
    <button onclick="shufflePlayers()">🔀 SORTEAR CHAVES</button>
    <button class="btn-reset" onclick="resetBracket()">RESETAR</button>
  </div>

  <script>
  const ROUNDS = ['OITAVAS','QUARTAS','SEMI','FINAL'];
  let players = [];
  let bracket = { oitavas:[], quartas:[], semi:[], final:[], campeao:null };

  async function loadPlayers() {
    try {
      const r = await fetch('/api/vouchers.php');
      const all = await r.json();
      players = all.filter(v => v.tipo === 'batalha').map(v => ({ id:v.id, nome:v.nome, placa:v.placa, carro:v.carro }));
    } catch(e) { players = []; }

    // Load saved bracket
    const saved = localStorage.getItem('vulto_bracket');
    if (saved) { bracket = JSON.parse(saved); }
    else { initBracket(); }
    render();
  }

  function initBracket() {
    // Fill 16 slots
    const slots = [];
    for (let i=0;i<16;i++) slots.push(players[i] || {id:null,nome:'— vaga —',placa:'',carro:''});
    bracket.oitavas = [];
    for (let i=0;i<16;i+=2) bracket.oitavas.push({p1:slots[i],p2:slots[i+1],winner:null});
    bracket.quartas = Array(4).fill(null).map(()=>({p1:null,p2:null,winner:null}));
    bracket.semi = Array(2).fill(null).map(()=>({p1:null,p2:null,winner:null}));
    bracket.final = [{p1:null,p2:null,winner:null}];
    bracket.campeao = null;
    save();
  }

  function shufflePlayers() {
    if (!confirm('Sortear novas chaves? Isso reseta o bracket.')) return;
    for (let i=players.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[players[i],players[j]]=[players[j],players[i]];}
    initBracket();
    render();
  }

  function resetBracket() {
    if (!confirm('Resetar todo o chaveamento?')) return;
    initBracket();
    render();
  }

  function selectWinner(round, matchIdx, playerNum) {
    const rounds = ['oitavas','quartas','semi','final'];
    const match = bracket[rounds[round]][matchIdx];
    const winner = playerNum === 1 ? match.p1 : match.p2;
    if (!winner || !winner.id) return;
    match.winner = winner;

    // Advance to next round
    if (round < 3) {
      const nextRound = rounds[round+1];
      const nextMatchIdx = Math.floor(matchIdx / 2);
      const slot = matchIdx % 2 === 0 ? 'p1' : 'p2';
      bracket[nextRound][nextMatchIdx][slot] = winner;
    }

    // Check champion
    if (round === 3 && match.winner) {
      bracket.campeao = match.winner;
    }

    save();
    render();
  }

  function save() { localStorage.setItem('vulto_bracket', JSON.stringify(bracket)); }

  function render() {
    const rounds = ['oitavas','quartas','semi','final'];
    let html = '';
    rounds.forEach((r,ri) => {
      html += `<div class="round"><div class="round-title">${ROUNDS[ri]}</div>`;
      bracket[r].forEach((match,mi) => {
        const p1 = match.p1 || {nome:'—'};
        const p2 = match.p2 || {nome:'—'};
        const w1 = match.winner && match.winner.id === (p1.id||'x') ? 'winner' : '';
        const w2 = match.winner && match.winner.id === (p2.id||'y') ? 'winner' : '';
        html += `<div class="match">
          <div class="match-player ${w1}" onclick="selectWinner(${ri},${mi},1)"><span class="name">${p1.nome||'—'}</span><span class="check">${w1?'✓':''}</span></div>
          <div class="match-player ${w2}" onclick="selectWinner(${ri},${mi},2)"><span class="name">${p2.nome||'—'}</span><span class="check">${w2?'✓':''}</span></div>
        </div>`;
      });
      html += '</div>';
    });
    document.getElementById('bracket').innerHTML = html;

    // Champion
    const champ = document.getElementById('champion');
    if (bracket.campeao) {
      champ.classList.add('show');
      document.getElementById('champion-name').textContent = bracket.campeao.nome + ' — ' + bracket.campeao.carro + ' (' + bracket.campeao.placa + ')';
    } else {
      champ.classList.remove('show');
    }
  }

  loadPlayers();
  </script>
</body>
</html>
