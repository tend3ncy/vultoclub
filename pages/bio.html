<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>VULTO CLUB — Links</title>
  <link rel="icon" type="image/png" href="/arquivos/logo.png" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet" />
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    
    body {
      font-family: 'Inter', sans-serif;
      background: #060608;
      color: #f0f0f0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 2rem 1rem;
    }
    
    .bio-container {
      max-width: 680px;
      width: 100%;
    }
    
    .bio-header {
      text-align: center;
      margin-bottom: 2rem;
    }
    
    .bio-logo {
      width: 100px;
      height: 100px;
      border-radius: 50%;
      margin: 0 auto 1rem;
      background: #0a0a0f;
      border: 2px solid rgba(255,255,255,0.1);
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: 'Bebas Neue', sans-serif;
      font-size: 1.8rem;
      letter-spacing: 0.1em;
    }
    
    .bio-title {
      font-family: 'Bebas Neue', sans-serif;
      font-size: 2rem;
      letter-spacing: 0.15em;
      margin-bottom: 0.5rem;
    }
    
    .bio-description {
      font-size: 0.9rem;
      color: #999;
      line-height: 1.6;
      max-width: 400px;
      margin: 0 auto;
    }
    
    .bio-links {
      display: flex;
      flex-direction: column;
      gap: 1rem;
    }
    
    .bio-section-title {
      font-family: 'Bebas Neue', sans-serif;
      font-size: 1.2rem;
      letter-spacing: 0.1em;
      color: #666;
      margin-top: 2rem;
      margin-bottom: 0.5rem;
      text-align: center;
    }
    
    .bio-link {
      display: flex;
      align-items: center;
      gap: 1rem;
      padding: 1.2rem 1.5rem;
      background: rgba(255,255,255,0.03);
      border: 1px solid rgba(255,255,255,0.08);
      text-decoration: none;
      color: #f0f0f0;
      transition: all 0.3s;
      position: relative;
      overflow: hidden;
    }
    
    .bio-link:hover {
      background: rgba(255,255,255,0.06);
      border-color: rgba(255,255,255,0.15);
      transform: translateY(-2px);
    }
    
    .bio-link-icon {
      width: 40px;
      height: 40px;
      display: flex;
      align-items: center;
      justify-content: center;
      background: rgba(255,255,255,0.05);
      border-radius: 8px;
      flex-shrink: 0;
    }
    
    .bio-link-content {
      flex: 1;
    }
    
    .bio-link-title {
      font-weight: 600;
      font-size: 0.95rem;
      letter-spacing: 0.05em;
      margin-bottom: 0.2rem;
    }
    
    .bio-link-subtitle {
      font-size: 0.75rem;
      color: #666;
      letter-spacing: 0.05em;
    }
    
    .bio-link-arrow {
      color: #666;
      font-size: 1.2rem;
    }
    
    .bio-link.featured {
      background: rgba(255,255,255,0.08);
      border-color: rgba(255,255,255,0.15);
    }
    
    .bio-link.featured .bio-link-icon {
      background: #f0f0f0;
      color: #000;
    }
    
    @media (max-width: 640px) {
      .bio-title {
        font-size: 1.6rem;
      }
      
      .bio-link {
        padding: 1rem 1.2rem;
      }
      
      .bio-link-icon {
        width: 36px;
        height: 36px;
      }
    }
  </style>
</head>
<body>
  <div class="bio-container">
    <div class="bio-header">
      <div class="bio-logo">VULTO</div>
      <h1 class="bio-title">VULTO CLUB</h1>
      <p class="bio-description">
        Vista a balaclava. Acelere na madrugada.<br>
        Faça história sem deixar rastro.
      </p>
    </div>

    <div class="bio-links">
      <!-- LOJA -->
      <a href="/" class="bio-link featured">
        <div class="bio-link-icon">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <circle cx="9" cy="21" r="1"/><circle cx="20" cy="21" r="1"/>
            <path d="M1 1h4l2.68 13.39a2 2 0 0 0 2 1.61h9.72a2 2 0 0 0 2-1.61L23 6H6"/>
          </svg>
        </div>
        <div class="bio-link-content">
          <div class="bio-link-title">LOJA OFICIAL</div>
          <div class="bio-link-subtitle">Camisetas, adesivos e mais</div>
        </div>
        <div class="bio-link-arrow">→</div>
      </a>

      <!-- GRUPO WHATSAPP -->
      <a href="https://chat.whatsapp.com/BAyVuSfarcPBGPTnBzfLcb" class="bio-link">
        <div class="bio-link-icon">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M21 11.5a8.38 8.38 0 0 1-.9 3.8 8.5 8.5 0 0 1-7.6 4.7 8.38 8.38 0 0 1-3.8-.9L3 21l1.9-5.7a8.38 8.38 0 0 1-.9-3.8 8.5 8.5 0 0 1 4.7-7.6 8.38 8.38 0 0 1 3.8-.9h.5a8.48 8.48 0 0 1 8 8v.5z"/>
          </svg>
        </div>
        <div class="bio-link-content">
          <div class="bio-link-title">GRUPO WHATSAPP</div>
          <div class="bio-link-subtitle">Comunidade exclusiva</div>
        </div>
        <div class="bio-link-arrow">→</div>
      </a>

      <div class="bio-section-title">— MAIS —</div>

      <!-- EVENTOS -->
      <a href="/eventos" class="bio-link">
        <div class="bio-link-icon">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <rect x="3" y="4" width="18" height="18" rx="2" ry="2"/>
            <line x1="16" y1="2" x2="16" y2="6"/>
            <line x1="8" y1="2" x2="8" y2="6"/>
            <line x1="3" y1="10" x2="21" y2="10"/>
          </svg>
        </div>
        <div class="bio-link-content">
          <div class="bio-link-title">EVENTOS</div>
          <div class="bio-link-subtitle">Rolês e encontros</div>
        </div>
        <div class="bio-link-arrow">→</div>
      </a>

      <!-- LINKS RECOMENDADOS -->
      <a href="/links" class="bio-link">
        <div class="bio-link-icon">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M10 13a5 5 0 0 0 7.54.54l3-3a5 5 0 0 0-7.07-7.07l-1.72 1.71"/>
            <path d="M14 11a5 5 0 0 0-7.54-.54l-3 3a5 5 0 0 0 7.07 7.07l1.71-1.71"/>
          </svg>
        </div>
        <div class="bio-link-content">
          <div class="bio-link-title">LINKS RECOMENDADOS</div>
          <div class="bio-link-subtitle">Curadoria VULTO</div>
        </div>
        <div class="bio-link-arrow">→</div>
      </a>
    </div>
  </div>
</body>
</html>
