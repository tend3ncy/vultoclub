<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Parceiros — VULTO CLUB</title>
  <link rel="icon" type="image/png" href="../arquivos/logo.png" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="/css/style.css" />
  <style>
    .parcerias-page{min-height:100vh;padding:8rem 2rem 4rem;background:var(--bg)}
    .parcerias-container{max-width:900px;margin:0 auto;text-align:center}
    .parcerias-container h1{font-family:var(--font-display);font-size:2.5rem;letter-spacing:.1em;margin-bottom:.5rem}
    .parcerias-container .sub{font-size:.85rem;color:var(--muted2);margin-bottom:3rem}
    .parceiros-list{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:1.5rem;text-align:center}
    .parceiro-item{background:var(--bg2);border:1px solid var(--border);padding:2rem 1.5rem;transition:border-color .2s}
    .parceiro-item:hover{border-color:rgba(255,255,255,.2)}
    .parceiro-avatar{width:80px;height:80px;border-radius:50%;margin:0 auto 1rem;overflow:hidden;background:rgba(255,255,255,.05);display:flex;align-items:center;justify-content:center}
    .parceiro-avatar img{width:100%;height:100%;object-fit:cover}
    .parceiro-nome{font-size:1rem;font-weight:600;margin-bottom:.25rem}
    .parceiro-ig{font-size:.75rem;color:var(--muted2);margin-bottom:1rem}
    .parceiro-ig a{color:var(--muted2);text-decoration:none;transition:color .2s}
    .parceiro-ig a:hover{color:var(--white)}
    .parceiro-cupom{display:inline-block;background:rgba(255,255,255,.05);border:1px solid rgba(255,255,255,.15);padding:.5rem 1rem;font-family:monospace;font-size:.8rem;letter-spacing:.1em;color:var(--white);cursor:pointer;transition:all .2s}
    .parceiro-cupom:hover{background:rgba(255,255,255,.1)}
    .parceiro-desconto{font-size:.68rem;color:#fbbf24;margin-top:.5rem;letter-spacing:.1em}
    .parceiro-links{display:flex;gap:.5rem;justify-content:center;margin-bottom:1rem}
    .parceiro-btn{display:inline-flex;align-items:center;gap:.4rem;padding:.5rem 1rem;font-size:.62rem;font-weight:700;letter-spacing:.1em;text-decoration:none;border-radius:3px;transition:all .2s}
    .parceiro-btn.ig{background:linear-gradient(135deg,#833ab4,#fd1d1d,#fcb045);color:#fff}
    .parceiro-btn.ig:hover{opacity:.85;transform:translateY(-1px)}
    .parceiro-btn.wpp{background:#25D366;color:#fff}
    .parceiro-btn.wpp:hover{background:#20BA5A;transform:translateY(-1px)}
    .empty{color:var(--muted2);padding:3rem}
    @media(max-width:600px){.parcerias-page{padding:6rem 1.25rem 3rem}.parceiros-list{grid-template-columns:1fr}}
  </style>
</head>
<body>
  <nav class="nav">
    <div class="nav-logo"><a href="/"><img src="../arquivos/logo.png" alt="VULTO CLUB" class="nav-logo-img" /></a></div>
    <ul class="nav-links">
      <li><a href="/">HOME</a></li>
      <li><a href="/#shop">SHOP</a></li>
      <li><a href="/eventos">EVENTOS</a></li>
      <li><a href="/pages/parcerias.html" class="active">PARCEIROS</a></li>
    </ul>
    <button class="nav-toggle" id="nav-toggle" aria-label="Menu"><span></span><span></span><span></span></button>
  </nav>

  <main class="parcerias-page">
    <div class="parcerias-container">
      <h1>PARCEIROS</h1>
      <p class="sub">Quem faz parte do movimento. Use o cupom e garanta desconto exclusivo.</p>
      <div class="parceiros-list" id="parceiros-list">
        <p class="empty">Carregando...</p>
      </div>
    </div>
  </main>

  <script>
  (async function(){
    try {
      const r = await fetch('/api/parcerias');
      const parceiros = await r.json();
      const ativos = parceiros.filter(p => p.ativo);
      const list = document.getElementById('parceiros-list');

      if (!ativos.length) {
        list.innerHTML = '<p class="empty">Nenhum parceiro no momento.</p>';
        return;
      }

      list.innerHTML = ativos.map(p => {
        const igUser = p.instagram ? p.instagram.replace('@','') : '';
        const whatsappMsg = encodeURIComponent('Oi! Vim pela Vulto Club, queria saber mais sobre os serviços.');
        const whatsappNum = p.contato ? p.contato.replace(/\D/g,'') : '';
        return `
        <div class="parceiro-item">
          <div class="parceiro-avatar">
            ${p.logo ? '<img src="'+p.logo+'" alt="'+p.nome+'" />' : '<span style="font-size:2rem">👤</span>'}
          </div>
          <div class="parceiro-nome">${p.nome}</div>
          <div class="parceiro-ig">
            ${igUser ? '<a href="https://instagram.com/'+igUser+'" target="_blank">@'+igUser+'</a>' : ''}
          </div>
          <div class="parceiro-links">
            ${igUser ? '<a href="https://instagram.com/'+igUser+'" target="_blank" class="parceiro-btn ig"><svg width="14" height="14" fill="currentColor" viewBox="0 0 24 24"><path d="M12 2.163c3.204 0 3.584.012 4.85.07 3.252.148 4.771 1.691 4.919 4.919.058 1.265.069 1.645.069 4.849 0 3.205-.012 3.584-.069 4.849-.149 3.225-1.664 4.771-4.919 4.919-1.266.058-1.644.07-4.85.07-3.204 0-3.584-.012-4.849-.07-3.26-.149-4.771-1.699-4.919-4.92-.058-1.265-.07-1.644-.07-4.849 0-3.204.013-3.583.07-4.849.149-3.227 1.664-4.771 4.919-4.919 1.266-.057 1.645-.069 4.849-.069zM12 0C8.741 0 8.333.014 7.053.072 2.695.272.273 2.69.073 7.052.014 8.333 0 8.741 0 12c0 3.259.014 3.668.072 4.948.2 4.358 2.618 6.78 6.98 6.98C8.333 23.986 8.741 24 12 24c3.259 0 3.668-.014 4.948-.072 4.354-.2 6.782-2.618 6.979-6.98.059-1.28.073-1.689.073-4.948 0-3.259-.014-3.667-.072-4.947-.196-4.354-2.617-6.78-6.979-6.98C15.668.014 15.259 0 12 0zm0 5.838a6.162 6.162 0 100 12.324 6.162 6.162 0 000-12.324zM12 16a4 4 0 110-8 4 4 0 010 8zm6.406-11.845a1.44 1.44 0 100 2.881 1.44 1.44 0 000-2.881z"/></svg> INSTAGRAM</a>' : ''}
            ${whatsappNum ? '<a href="https://wa.me/55'+whatsappNum+'?text='+whatsappMsg+'" target="_blank" class="parceiro-btn wpp"><svg width="14" height="14" fill="currentColor" viewBox="0 0 24 24"><path d="M17.472 14.382c-.297-.149-1.758-.867-2.03-.967-.273-.099-.471-.148-.67.15-.197.297-.767.966-.94 1.164-.173.199-.347.223-.644.075-.297-.15-1.255-.463-2.39-1.475-.883-.788-1.48-1.761-1.653-2.059-.173-.297-.018-.458.13-.606.134-.133.298-.347.446-.52.149-.174.198-.298.298-.497.099-.198.05-.371-.025-.52-.075-.149-.669-1.612-.916-2.207-.242-.579-.487-.5-.669-.51-.173-.008-.371-.01-.57-.01-.198 0-.52.074-.792.372-.272.297-1.04 1.016-1.04 2.479 0 1.462 1.065 2.875 1.213 3.074.149.198 2.096 3.2 5.077 4.487.709.306 1.262.489 1.694.625.712.227 1.36.195 1.871.118.571-.085 1.758-.719 2.006-1.413.248-.694.248-1.289.173-1.413-.074-.124-.272-.198-.57-.347m-5.421 7.403h-.004a9.87 9.87 0 01-5.031-1.378l-.361-.214-3.741.982.998-3.648-.235-.374a9.86 9.86 0 01-1.51-5.26c.001-5.45 4.436-9.884 9.888-9.884 2.64 0 5.122 1.03 6.988 2.898a9.825 9.825 0 012.893 6.994c-.003 5.45-4.437 9.884-9.885 9.884m8.413-18.297A11.815 11.815 0 0012.05 0C5.495 0 .16 5.335.157 11.892c0 2.096.547 4.142 1.588 5.945L.057 24l6.305-1.654a11.882 11.882 0 005.683 1.448h.005c6.554 0 11.89-5.335 11.893-11.893a11.821 11.821 0 00-3.48-8.413Z"/></svg> WHATSAPP</a>' : ''}
          </div>
          ${p.cupom ? '<div class="parceiro-cupom" onclick="copiarCupom(this,\''+p.cupom+'\')">'+p.cupom+'</div>' : ''}
          ${p.desconto ? '<div class="parceiro-desconto">'+p.desconto+'% OFF com este cupom</div>' : ''}
        </div>
      `}).join('');
    } catch(e) {
      document.getElementById('parceiros-list').innerHTML = '<p class="empty">Erro ao carregar parceiros.</p>';
    }
  })();

  function copiarCupom(el, cupom) {
    navigator.clipboard.writeText(cupom);
    const orig = el.textContent;
    el.textContent = 'COPIADO ✓';
    el.style.borderColor = '#22c55e';
    el.style.color = '#22c55e';
    setTimeout(() => { el.textContent = orig; el.style.borderColor = ''; el.style.color = ''; }, 2000);
  }

  // Nav toggle
  const nt = document.getElementById('nav-toggle');
  if(nt) nt.addEventListener('click', function(){this.classList.toggle('active');});
  </script>
</body>
</html>
